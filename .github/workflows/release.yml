name: Release

# Runs on every v* tag (pushed by release-tag.yml when a release/v* branch merges, or by
# hand). Builds the distributable, publishes the GitHub Release with RELEASE.md as its
# body and the zip attached, then deploys that tag to WordPress.org.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check the tag matches the plugin version and stable tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 "^ \* Version:" fleetbase-for-woocommerce.php | awk '{print $3}')
          STABLE=$(grep -m1 "^Stable tag:" readme.txt | awk '{print $3}')
          test "$TAG" = "$HEADER" || { echo "Tag $TAG does not match plugin header version $HEADER"; exit 1; }
          test "$TAG" = "$STABLE" || { echo "Tag $TAG does not match readme.txt stable tag $STABLE"; exit 1; }
      - run: composer install --no-interaction --prefer-dist
      - run: bash scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE.md
          files: build/fleetbase-for-woocommerce.zip
          generate_release_notes: true

  # Called directly rather than through `on: release`, because a Release published with
  # GITHUB_TOKEN never triggers other workflows.
  deploy-wporg:
    name: Deploy to WordPress.org
    needs: build
    uses: ./.github/workflows/deploy-wporg.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
