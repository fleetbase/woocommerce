name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} lint, analyse, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test

  js:
    name: JS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:js
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: assets-build
          path: assets/build

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    needs: [ js ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets-build
          path: assets/build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - uses: wordpress/plugin-check-action@v1
        with:
          categories: |
            plugin_repo
            security
          exclude-directories: |
            vendor
            node_modules
            tests
            docs
            scripts
            build
          exclude-files: |
            phpunit.xml.dist
            phpstan.neon
            phpcs.xml
            webpack.config.js
            composer.json
            composer.lock
            package.json
            pnpm-lock.yaml
